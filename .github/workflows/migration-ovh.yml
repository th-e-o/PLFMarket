name: Migration OVH → VPS (une seule fois)

# À lancer à la main (Actions → Migration OVH → VPS → Run workflow), APRÈS que plf.deltastat.fr
# réponde depuis le VPS (DNS créé + premier déploiement).
#
# « basculer » :
#   1. remplace la racine OVH (www/index.html + www/.htaccess) par la page d'accueil de deltastat.fr,
#      qui redirige api.php et static/ vers plf.deltastat.fr : plus aucune écriture côté OVH ;
#   2. télécharge www/data/ (base SQLite et cache des actualités, sans les sessions) ;
#   3. l'envoie dans /srv/plf/web/data/ sur le VPS (remplace la base vide créée au premier passage).
# « nettoyer » (après vérification) : supprime de www/ les fichiers de l'ancienne app (base comprise).
#   www/.ovhconfig, la page d'accueil et les dossiers des autres apps ne sont pas touchés.

on:
  workflow_dispatch:
    inputs:
      etape:
        description: "basculer ou nettoyer"
        required: true
        type: choice
        options: [basculer, nettoyer]

concurrency: deploiement-plf

jobs:
  migrer:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Installer lftp
        run: sudo apt-get install -y -qq lftp >/dev/null

      - name: Basculer la racine OVH et récupérer data/
        if: inputs.etape == 'basculer'
        run: |
          mkdir -p donnees
          lftp --env-password -u "$FTP_USERNAME" "$FTP_SERVER" -e "
            set cmd:fail-exit yes;
            put ovh-racine/.htaccess -o www/.htaccess;
            put ovh-racine/index.html -o www/index.html;
            mirror --verbose --exclude-glob sessions/ www/data/ donnees/;
            bye"
          ls -la donnees

      - name: Envoyer data/ sur le VPS
        if: inputs.etape == 'basculer'
        env:
          CLE: ${{ secrets.DEPLOY_SSH_KEY }}
          HOTES_CONNUS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          HOTE: ${{ vars.DEPLOY_HOST || '217.182.169.200' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$CLE" > ~/.ssh/deploiement && chmod 600 ~/.ssh/deploiement
          printf '%s\n' "$HOTES_CONNUS" > ~/.ssh/known_hosts
          test -f donnees/plf.db || { echo "::error::www/data/plf.db introuvable sur OVH"; exit 1; }
          # --delete : la base vide éventuellement créée au premier passage (et son WAL) est remplacée.
          rsync -rlptz --delete --chmod=D700,F600 --exclude='/sessions/' --exclude='/.htaccess' \
            -e 'ssh -i ~/.ssh/deploiement -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes' \
            donnees/ "plf@$HOTE:/data/"

      - name: Nettoyer l'ancienne app sur OVH
        if: inputs.etape == 'nettoyer'
        run: |
          lftp --env-password -u "$FTP_USERNAME" "$FTP_SERVER" -e "
            set cmd:fail-exit no;
            rm -f www/api.php www/config.php www/config.exemple.php www/README.md www/.ftp-deploy-sync-state.json;
            rm -rf www/static www/data www/scripts;
            cls -la www/;
            bye"

name: Déploiement VPS (plf.deltastat.fr)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploiement-plf

jobs:
  deployer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier la syntaxe PHP
        run: for f in *.php scripts/*.php; do php -l "$f"; done

      - name: Générer config.php depuis les secrets
        env:
          PLF_ADMIN_PASSWORD: ${{ secrets.PLF_ADMIN_PASSWORD }}
          PLF_DB_DSN: ${{ secrets.PLF_DB_DSN }}
          PLF_DB_USER: ${{ secrets.PLF_DB_USER }}
          PLF_DB_PASSWORD: ${{ secrets.PLF_DB_PASSWORD }}
          PLF_CAPITAL: ${{ vars.PLF_CAPITAL }}
          PLF_AMORCE: ${{ vars.PLF_AMORCE }}
        run: php scripts/generer-config.php

      - name: Versionner CSS et JS (contourne le cache des navigateurs)
        run: sed -i "s/__VERSION__/${GITHUB_SHA::8}/g" index.html

      - name: Envoyer sur le VPS (rsync)
        # La clé DEPLOY_SSH_KEY ne peut que lancer rsync dans /srv/plf/web (rrsync côté serveur) :
        # elle ne peut ni toucher aux autres apps ni exécuter de commande.
        # data/ (base, sessions, cache des actualités) n'est jamais envoyé, écrasé ni supprimé.
        env:
          CLE: ${{ secrets.DEPLOY_SSH_KEY }}
          HOTES_CONNUS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          HOTE: ${{ vars.DEPLOY_HOST || '217.182.169.200' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$CLE" > ~/.ssh/deploiement && chmod 600 ~/.ssh/deploiement
          printf '%s\n' "$HOTES_CONNUS" > ~/.ssh/known_hosts
          rsync -rlptz --delete --chmod=D750,F640 \
            --exclude='/data/' --exclude='.git*' --exclude='/.github/' --exclude='/scripts/' \
            --exclude='/ovh-racine/' --exclude='/README.md' --exclude='/config.exemple.php' \
            -e 'ssh -i ~/.ssh/deploiement -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes' \
            ./ "plf@$HOTE:/"
